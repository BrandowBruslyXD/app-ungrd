# Verifica el backend en cada Pull Request.
#
# Por qué existe: solo había un workflow, el de desplegar a Azure, que corre
# DESPUÉS del merge y no ejecuta ninguna prueba. Tres pruebas llevaban rotas en
# `main` sin que nadie se enterara — dos porque el enum de tipos creció y una
# porque daba por hecho que Azure no estaba disponible.
name: Verificar backend

on:
  pull_request:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/verificar-backend.yml"
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/verificar-backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verificar-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          # La versión sale de global.json para que sea la misma que en local.
          global-json-file: back/global.json

      - name: Restaurar dependencias
        run: dotnet restore back/ConectaRiesgoAI.slnx

      - name: Compilar
        run: dotnet build back/ConectaRiesgoAI.slnx --no-restore --configuration Release

      - name: Correr pruebas con cobertura
        run: dotnet test back/ConectaRiesgoAI.slnx --no-build --configuration Release --verbosity minimal --settings back/tests/ConectaRiesgoAI.Api.Tests/coverlet.runsettings --collect:"XPlat Code Coverage"

      - name: Instalar ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generar reporte de cobertura
        run: |
          reportgenerator "-reports:back/tests/ConectaRiesgoAI.Api.Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:MarkdownSummary;Cobertura" -verbosity:Verbose
          if [ ! -f coverage-report/coverage.cobertura.xml ]; then
            echo "::error::No se generó coverage.cobertura.xml — reportgenerator falló o no encontró archivos de entrada"
            exit 1
          fi

      - name: Validar umbral de cobertura (90%)
        run: |
          set -e
          LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' coverage-report/coverage.cobertura.xml | head -1)
          if [ -z "$LINE_RATE" ]; then
            echo "::error::No se pudo extraer line-rate del XML de cobertura — XML corrupto o atributo ausente"
            exit 1
          fi

          LINE_PCT=$(echo "$LINE_RATE * 100" | bc)
          THRESHOLD=90

          echo "Cobertura de línea: ${LINE_PCT}%"
          echo "Umbral requerido: ${THRESHOLD}%"

          if awk "BEGIN {exit !($LINE_PCT < $THRESHOLD)}"; then
            echo "::error::La cobertura de línea (${LINE_PCT}%) está por debajo del umbral requerido (${THRESHOLD}%)"
            exit 1
          fi

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          echo "## 📊 Cobertura de Tests del Backend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat coverage-report/Summary.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No se pudo generar el resumen de cobertura" >> $GITHUB_STEP_SUMMARY

      - name: Subir artefacto de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30
