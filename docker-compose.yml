services:
  postgres:
    image: postgres:17-alpine
    container_name: conectariesgoai-db
    environment:
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta_dev
      POSTGRES_DB: conectariesgoai
    ports:
      - "5432:5432"
    volumes:
      - conectariesgoai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta -d conectariesgoai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conectariesgoai_pgdata:
