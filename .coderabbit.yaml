# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# Configuracion de CodeRabbit para ConectaRiesgoAI (hackathon UNGRD, 20 horas).
# Esquema oficial: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# Referencia:      https://docs.coderabbit.ai/reference/configuration
#
# Filosofia: revisor rapido que caza bugs reales y secretos filtrados.
# NO opina de estilo, nombres, formato ni cobertura de tests: con 20 horas
# un revisor perfeccionista termina silenciado.
# Ver docs/CODERABBIT.md para el manual del equipo.

language: "es"

tone_instructions: "Responde en espanol, directo y breve. Es un hackathon de 20 horas: prioriza bugs reales, secretos filtrados y fallos que rompan la demo. No comentes estilo, nombres, formato, tests ni refactors."

early_access: false
enable_free_tier: true

reviews:
  # quiet = solo lo importante | chill = balanceado | assertive = quisquilloso
  profile: "quiet"

  # false => CodeRabbit NUNCA aprueba automaticamente el PR.
  # main exige 1 aprobacion HUMANA; el bot solo comenta.
  request_changes_workflow: false

  # Resumen automatico del PR
  high_level_summary: true
  high_level_summary_instructions: "Resume en espanol en 3-6 vinetas: que cambia, que endpoints/pantallas toca y que hay que probar a mano en la demo. Nada de relleno."
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  collapse_walkthrough: true
  changed_files_summary: true

  # Estado de revision visible, pero sin bloquear el merge
  review_status: true
  review_details: false
  review_progress: true
  commit_status: true
  fail_commit_status: false

  # Ruido apagado: en un hackathon nadie lee diagramas ni poemas
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  # No creamos ni aplicamos labels desde el bot
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  abort_on_close: true

  # slop_detection etiqueta PRs como spam: no queremos labels automaticas
  slop_detection:
    enabled: false

  # Que NO se analiza (menos ruido y clones mas rapidos: path_filters
  # tambien se aplica al sparse-checkout del repo)
  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!investigacion-*.md"
    - "!**/*.lock"
    - "!**/package-lock.json"

  path_instructions:
    # ---------------- .NET 10 (backend + integraciones) ----------------
    - path: "back/**"
      instructions: |
        Backend .NET 10 (ASP.NET Core + EF Core + PostgreSQL), incluidas las
        integraciones con APIs externas en back/src/ConectaRiesgoAI.Api/Integrations/
        (NASA FIRMS, SECOP). Revisa SOLO esto y en espanol:
        1. SECRETOS: cero cadenas de conexion de PostgreSQL, claves de firma JWT,
           API keys o tokens escritos en el codigo o en appsettings versionados.
           Deben leerse de configuracion/variables de entorno. Repositorio PUBLICO:
           cualquier credencial es hallazgo CRITICO.
        2. DEGRADACION: si una integracion externa falla (timeout, 4xx, 5xx, JSON
           invalido), debe devolver null o una lista vacia y registrar el error,
           NUNCA propagar la excepcion ni tumbar el endpoint. Marca todo await de
           HttpClient sin try/catch o sin manejo de !response.IsSuccessStatusCode.
        3. TIMEOUT: todo HttpClient debe tener Timeout explicito (o CancellationToken
           con tiempo limite). Un HttpClient sin timeout es un hallazgo.
        4. Bugs que rompen la demo: excepciones no controladas en los endpoints,
           null de referencia, deadlock por .Result/.Wait(), bucles infinitos de
           reintento, migraciones EF Core que borran datos, CORS mal configurado
           que deja al frontend sin poder llamar, endpoints sin autorizacion que
           exponen datos.
        NO comentes estilo, nombres, orden de usings, arquitectura, patrones,
        XML docs ni cobertura de tests.

    - path: "servicios/**"
      instructions: |
        Microservicios .NET 10 que consumen APIs externas (NASA FIRMS, SECOP, redes
        sociales): ms-satelital, ms-transparencia, ms-social. El destino final de estas
        integraciones (si se quedan aqui o migran a back/.../Integrations/) esta
        pendiente de decidir -- ver docs/ARQUITECTURA.md. Mientras tanto, revisa SOLO
        esto y en espanol:
        1. DEGRADACION: si la API externa falla (timeout, 4xx, 5xx, JSON invalido),
           el servicio debe devolver null o una lista vacia y registrar el error,
           NUNCA propagar la excepcion ni tumbar el endpoint.
        2. TIMEOUT: todo HttpClient debe tener Timeout explicito (o CancellationToken
           con tiempo limite). Un HttpClient sin timeout es un hallazgo.
        3. SECRETOS: ninguna API key, MapKey de NASA FIRMS, token de SECOP ni
           credencial de Bluesky/X puede aparecer en el codigo ni en appsettings*.json
           versionado. Deben venir de configuracion o variables de entorno. CRITICO:
           el repositorio es PUBLICO.
        NO comentes estilo, nombres, orden de usings, XML docs, ni pidas tests.

    - path: "front/**"
      instructions: |
        Frontend React + Vite + Tailwind, mobile-first, PWA, mapas con Leaflet.
        Revisa SOLO esto y en espanol:
        1. URLs QUEMADAS: ninguna URL de API (localhost, IPs, dominios de despliegue)
           escrita en el codigo. Deben venir de variables de entorno de Vite
           (import.meta.env.VITE_*). Cualquier fetch/axios con URL literal es hallazgo.
        2. SECRETOS: recuerda que todo VITE_* se empaqueta y queda PUBLICO en el
           bundle. Marca cualquier token, API key o credencial en el frontend.
        3. ESTADOS: cada fetch debe manejar carga (loading) y vacio/error. Marca
           componentes que asumen datos listos (.map sobre posible undefined,
           acceso a propiedades sin comprobar) porque revientan la pantalla en la demo.
        NO comentes estilo, nombres de componentes, orden de props, accesibilidad
        fina, memoizacion ni tests.

    # ---------------- Barrido antifugas en archivos de configuracion ----------------
    - path: "**/{appsettings*.json,*.env,.env*,*.config,docker-compose*.yml,**/secrets*.json}"
      instructions: |
        Archivo de configuracion en un repositorio PUBLICO. Revisa en espanol y
        reporta como CRITICO cualquier valor real de: cadena de conexion de
        PostgreSQL (Host/Username/Password), clave de firma JWT, MapKey de NASA
        FIRMS, token de SECOP, credenciales de Bluesky/X, o cualquier API key.
        Solo se aceptan placeholders vacios o referencias a variables de entorno.
        Si detectas un secreto real, indica que ademas de borrarlo hay que ROTARLO:
        el historial de git de un repo publico ya quedo expuesto.

  auto_review:
    enabled: true                      # revision automatica en cada PR
    auto_incremental_review: true      # y en cada push posterior
    auto_pause_after_reviewed_commits: 0  # 0 = nunca se auto-pausa (madrugada incluida)
    drafts: false                      # los PR en borrador NO se revisan (valvula de escape)
    ignore_title_keywords:
      - "WIP"
      - "borrador"
      - "no-revisar"
    labels: []
    base_branches: []
    ignore_usernames: []

  # Nada de generacion automatica de docstrings/tests/PRs de arreglo: gasta tiempo
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: true
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # Sin checks previos al merge: main ya exige 1 aprobacion humana
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

  tools:
    # --- SEGURIDAD AL MAXIMO (repo PUBLICO con credenciales reales) ---
    gitleaks:
      enabled: true      # escaner de secretos
    trufflehog:
      enabled: true      # escaner de secretos con verificacion activa
    semgrep:
      enabled: true      # vulnerabilidades y patrones inseguros
    opengrep:
      enabled: true      # motor adicional de analisis de seguridad
    osvScanner:
      enabled: true      # dependencias con CVE conocidos
    checkov:
      enabled: true      # infraestructura como codigo
    trivy:
      enabled: true      # IaC, Docker, Kubernetes
    dotenvLint:
      enabled: true      # archivos .env
    presidio:
      enabled: true      # datos personales (PII) en el diff
    github-checks:
      enabled: true

    # --- Calidad util (bugs reales) ---
    eslint:
      enabled: true
      e18e:
        enabled: false   # sugerencias de modernizar dependencias = ruido
    biome:
      enabled: true
    oxc:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    sqlfluff:
      enabled: true
    hadolint:
      enabled: true

    # --- Apagado: ruido de estilo/prosa ---
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true
  art: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
