        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- punto de "en línea" (guiño al estado del chat) -->
  <circle cx="50" cy="15" r="6" fill="#ffffff"/>
  <circle cx="50" cy="15" r="3.4" fill="#22d3ee"/>
