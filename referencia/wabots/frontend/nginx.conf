# Sirve el SPA y proxya /api y /socket.io al backend (mismo origen → sin CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://wabots-backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  location /socket.io/ {
    proxy_pass http://wabots-backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Los assets con hash en el nombre se pueden cachear "para siempre".
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El index.html NUNCA se cachea: así cada deploy se ve al instante (sin F5 forzado).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";

    # ── Cabeceras de seguridad ──
    # CSP: solo recursos propios. La app no usa inline scripts (Vite genera JS
    # externo); se permite 'unsafe-inline' SOLO para estilos (Tailwind/estilos
    # en línea de React). connect-src incluye wss para el WebSocket de sesión.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self): el probador del editor graba notas de voz para probar
    # la transcripción; solo el propio origen puede pedirlo (nunca terceros).
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=()" always;
  }
}
